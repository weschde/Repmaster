<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&family=Nunito:wght@400;600;700&display=swap">
<style>
/* Look: light and friendly. Soft teal on cool white, big rounded shapes, Outfit for titles and numbers, Nunito for text.
   Layout: one narrow column for a phone at the pull-up bar; tab bar at the bottom, timer dock above it in thumb reach. */
:root{
  --bg:#F1F6F5; --surface:#FFFFFF; --surface2:#F4F9F8; --ink:#10292B; --muted:#5B7370; --line:#E2ECEA;
  --accent:#0B8579; --accent2:#08695F; --accent-ink:#FFFFFF; --accent-soft:#DDF3EF; --accent-deep:#09645B;
  --rest:#FF9A62; --rest2:#FF8548; --rest-ink:#3B1A08; --ok:#0B8579; --danger:#D64545;
  --shadow:0 1px 2px rgba(16,60,55,.05),0 10px 28px rgba(16,60,55,.07);
  --btn-shadow:0 6px 16px rgba(11,133,121,.28);
  --f-head:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --pop:#E5533D; --pop2:#C93F2B; --pop-ink:#FFFFFF; --glow:0 8px 22px rgba(11,133,121,.22); --glow-pop:0 8px 22px rgba(229,83,61,.32);
  --nav:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B1514; --surface:#13201F; --surface2:#1A2A28; --ink:#E7F3F1; --muted:#8FAAA6; --line:#233735;
    --accent:#3FD0BE; --accent2:#2BB9A8; --accent-ink:#03211D; --accent-soft:#16373A; --accent-deep:#8BE9DC;
    --rest:#FF9A62; --rest2:#FF8548; --rest-ink:#3B1A08; --ok:#3FD0BE; --danger:#FF8A8A;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 28px rgba(0,0,0,.35);
    --btn-shadow:0 6px 16px rgba(0,0,0,.35);
    --pop:#FF7A66; --pop2:#F0583F; --pop-ink:#2B0D07; --glow:0 0 26px rgba(63,208,190,.38); --glow-pop:0 0 28px rgba(255,122,102,.45); --btn-shadow:0 0 22px rgba(63,208,190,.32),0 6px 16px rgba(0,0,0,.4);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1514; --surface:#13201F; --surface2:#1A2A28; --ink:#E7F3F1; --muted:#8FAAA6; --line:#233735;
  --accent:#3FD0BE; --accent2:#2BB9A8; --accent-ink:#03211D; --accent-soft:#16373A; --accent-deep:#8BE9DC;
  --rest:#FF9A62; --rest2:#FF8548; --rest-ink:#3B1A08; --ok:#3FD0BE; --danger:#FF8A8A;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 10px 28px rgba(0,0,0,.35);
  --btn-shadow:0 6px 16px rgba(0,0,0,.35);
  --pop:#FF7A66; --pop2:#F0583F; --pop-ink:#2B0D07; --glow:0 0 26px rgba(63,208,190,.38); --glow-pop:0 0 28px rgba(255,122,102,.45); --btn-shadow:0 0 22px rgba(63,208,190,.32),0 6px 16px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font:400 16px/1.45 var(--f-body); margin:0;
  padding-block:0;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#main{max-width:520px;margin:0 auto;padding-block:14px 300px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
.top h1{font:600 30px/1.1 var(--f-head);letter-spacing:-.01em}
.wk{display:flex;align-items:center;gap:10px}
.wk .lbl{font:600 14px var(--f-body);color:var(--muted)}
.badge{display:inline-grid;place-items:center;width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);font:600 26px/1 var(--f-head);box-shadow:var(--btn-shadow)}
.date{font:600 15px var(--f-body);color:var(--muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow)}
.card.pad{padding:18px}
.card h2{font:600 14px var(--f-body);color:var(--muted);margin-bottom:12px}
.ex-head{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:16px 18px;min-height:76px;cursor:pointer}
.ex-head:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
.ex-t{min-width:0}
.ex-t h3{font:600 20px/1.15 var(--f-head)}
.sub{display:block;color:var(--muted);font-size:14px;margin-top:3px}

.panel{padding:16px 18px 18px;display:grid;gap:14px;background:var(--surface2)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.row>span{color:var(--muted);font-size:15px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent-deep);font:600 24px/1 var(--f-body)}
.stepper output{min-width:76px;text-align:center;font:600 24px var(--f-head);font-variant-numeric:tabular-nums}
.stepper output.wide{min-width:120px;font-size:19px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--accent-soft)}
.seg button{min-height:40px;min-width:44px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--accent-deep);font:600 15px var(--f-body)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btn{min-height:48px;padding:0 20px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font:600 16px var(--f-body)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--accent-ink);border-color:transparent;box-shadow:var(--btn-shadow)}
.btn.big{min-height:58px;font-size:18px;width:100%;border-radius:18px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;min-height:40px;padding:0;font-size:14px;text-align:left}
.hint{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between;color:var(--muted);font-size:14px}
.empty{color:var(--muted);padding:18px 4px}
.last{color:var(--muted);font-size:14px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.tiles.three{grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:grid;gap:2px;min-width:0;align-content:start;box-shadow:var(--shadow)}
.card .tile{background:var(--surface2);border:0;box-shadow:none;padding:12px}
.tl{font-size:13px;color:var(--muted)}
.tile b{font:600 32px/1.1 var(--f-head)}
.tiles.three .tile b{font-size:24px}
.ts{font-size:13px;color:var(--muted)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.gl{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:12px var(--f-body)}
.bar{fill:var(--accent)}
.bar.cur{fill-opacity:.5}
.bar.hi{filter:brightness(1.15)}
.goal{stroke:var(--ink);stroke-opacity:.45;stroke-width:1;pointer-events:none}
.ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.area{fill:var(--accent);fill-opacity:.12}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.dot.hi{stroke:var(--ink)}
.xh{stroke:var(--muted);stroke-width:1;pointer-events:none}
.goal{stroke:var(--pop);stroke-width:1.5;stroke-dasharray:5 4}.goalt{fill:var(--pop2);font:700 11px var(--f-body)}.bestring{fill:none;stroke:var(--pop);stroke-width:2}
.val{fill:var(--ink);font:600 15px var(--f-head)}
.hit{fill:transparent;cursor:pointer}

<script>
(function(){

/* ---------- state ---------- */
var EXTRA={
  hs:{skill:true,setsHi:5,setsLo:3,target:20,tmin:20,tmax:30,tstep:5,nmin:3},
  fl:{skill:true,setsHi:5,setsLo:3,target:10,tmin:8,tmax:12,tstep:2,nmin:3},

  bss:{sets:3,rmin:6,rmax:10,weighted:true,per:true},
  pis:{sets:3,rmin:5,rmax:8,per:true},
  pike:{sets:3,rmin:5,rmax:8},
  hol:{sets:3,target:30,tmin:30,tmax:45,tstep:5,nmin:3,ladder:['Hollow Body','Arme über Kopf','Mit Gewicht']}

function defaultCfg(){var c=baseCfg();c.exercises.forEach(function(e){Object.assign(e,EXTRA[e.id]||{})});return c}

  return {
    ver:3,
    exercises:[
      {id:'hs',name:'Handstand',type:'time',ladder:['Brust zur Wand','Freie Linienversuche'],level:0,rest:90,target:30,beat:2,note:'3–5 saubere Versuche, ganz frisch zu Beginn. Hohlkreuz aktiv rausdrücken, Rippen rein, Schultern lang.'},
      {id:'fl',name:'Front Lever',type:'time',ladder:['Tuck','One-Leg Tuck','Advanced Tuck','Straddle'],level:0,rest:90,target:10,beat:2,note:'4–5 Sätze × 8–12 s maximale, saubere Spannung.'},
      {id:'pu',name:'Breite Klimmzüge',type:'ladder',ladder:['Breit'],level:0,rest:120,peak:3,series:3,note:'3 Serien, 2 Min Pause zwischen den vollständigen Leitern.'},
      {id:'bss',name:'Bulgarian Split Squats',type:'reps',ladder:['Körpergewicht','Mit Gewicht'],level:0,rest:90,lab:'Wiederholungen pro Bein',note:'3 Sätze × 6–10 pro Bein. Langsam, tief, kontrolliert, gern mit Zusatzgewicht.'},
      {id:'hsb',name:'Handstand Technik',type:'reps',ladder:['Kick-up'],level:0,rest:60,lab:'Versuche',note:'10–15 Min, ganz frisch. Kick-up-Mechanik, Handgelenks-Mobilität, saubere Schulteröffnung.'},
      {id:'dip',name:'Dips',type:'ladder',ladder:['Voller Umfang'],level:0,rest:150,peak:5,series:3,note:'2–3 Serien, 2–3 Min Pause zwischen den Leitern. Voller Umfang, kurzer Stopp im untersten Punkt.'},
      {id:'pis',name:'Pistol Squats',type:'reps',ladder:['Mit Festhalten','Frei'],level:0,rest:90,lab:'Wiederholungen pro Bein',note:'3 Sätze × 5–8 pro Bein. Bei Bedarf leicht an Türrahmen oder Stange festhalten.'},
      {id:'pike',name:'Pike Compressive Lifts',type:'reps',ladder:['Im Sitzen'],level:0,rest:60,note:'3 Sätze × 5–8. Im Sitzen Hände neben die Beine, Hüfte und Beine anheben.'},
      {id:'hol',name:'Hollow Body Hold',type:'time',ladder:['Standard'],level:0,rest:60,target:30,beat:5,note:'3 Sätze × 30 s, maximale Rumpfspannung.'}
    ],

    anchor:ymd(monday(new Date())),
    settings:{sound:true,prep:5,auto:true,goal:3,testHints:true,cycle:6,theme:'light'},
    hideHint:true

}
var cfg=defaultCfg(), days={}, mode='local', appRef=null, saveErr=false;
var setOpen={}, prevTab='today', histOpen={}, pendingScroll=null, painAsk=null, infoId=null, tab='today', openId=null, editId=null, confirmDel=null, draft={}, autoOpened=false, statRange=12, statEx=null, goalsOpen=null, testOpen=null, moreId=null, hintsOpen=false, grpOpen={}, formGrp=null, summaryOpen=false, editToday=false, impPending=null, impMsg='', deferredInstall=null, testDraft={}, testRes={};
var T=null, tickId=null, wake=null, ac=null, holdPend=null;

function adopt(c){
  if(!c) return;
  var d=defaultCfg();
  if(c.ver===3){
    cfg=Object.assign(d,c);
    cfg.settings=Object.assign(defaultCfg().settings,c.settings||{});
    return;
  }
  if(c.ver===2){
    (c.exercises||[]).forEach(function(o){
      var n=d.exercises.find(function(x){return x.id===o.id});
      if(n){
        ['level','peak','series','target','rest','beat','up'].forEach(function(f){if(o[f]!==undefined)n[f]=o[f]});
        n.level=Math.min(n.level,n.ladder.length-1);
      }else d.exercises.push(o);
    });
    d.settings=Object.assign(d.settings,c.settings||{});
    d.anchor=c.anchor||d.anchor;
    cfg=d;
  }
}
function getEx(id){return cfg.exercises.find(function(e){return e.id===id})}
/* A and B alternate with every training session, not every week. */
function weekType(){
  var t=todayKey();
  if(days[t]&&days[t].plan) return days[t].plan;
  if(cfg.override&&cfg.override.d===t) return cfg.override.t;
  var ks=dayKeys().filter(function(k){return k<t});
  if(!ks.length) return 'A';
  var last=ks[ks.length-1], lt=days[last].plan;
  if(!lt) lt=(ks.length%2===1)?'A':'B';
  return lt==='A'?'B':'A';
}
function setWeek(t){
  var k=todayKey();
  if(t===weekType()) return;
  cfg.override={d:k,t:t};
  if(days[k]&&days[k].plan) days[k].plan=t;
}
function todaySets(){var k=ymd(new Date());return (days[k]&&days[k].sets)||[]}
function lastSet(id){
  var keys=Object.keys(days).sort().reverse();
  for(var i=0;i<keys.length;i++){
    var ss=(days[keys[i]].sets||[]);
    for(var j=ss.length-1;j>=0;j--) if(ss[j].e===id) return ss[j];
  }
  return null;
}
function ladderSummary(ss){
  var ser=[];
  ss.forEach(function(x){
    var cur=ser[ser.length-1];
    if(!cur||x.r===0||x.p!==cur.p||(x.b||1)!==cur.b||(x.w||0)!==cur.w||x.r<=cur.r){cur={p:x.p,b:x.b||1,w:x.w||0,r:x.r,reps:0};ser.push(cur)}
    cur.r=x.r; cur.reps+=x.v;
  });
  var total=ss.reduce(function(a,x){return a+x.v},0), full={}, part=[];
  ser.forEach(function(c){
    var len=rungs(c.p,c.b).length, key=(c.p*100+c.b)*1000+Math.round((c.w||0)*10);
    if(c.r===len-1) full[key]=(full[key]||0)+1; else part.push(c);
  });
  var lines=Object.keys(full).map(Number).sort(function(a,b2){return a-b2}).map(function(pk){
    return full[pk]+(full[pk]===1?' Leiter':' Leitern')+' ('+rungs(Math.floor(pk/100000),Math.floor(pk/1000)%100).join(', ')+')'+((pk%1000)>0?' +'+(pk%1000)/10+' kg':'');
  });
  part.forEach(function(c){lines.push('1 Leiter unvollständig ('+rungs(c.p,c.b).slice(0,c.r+1).join(', ')+')'+(c.w>0?' +'+c.w+' kg':''))});
  return {lines:lines,total:total};
}
function fmtDur(t){t=Math.round(t);return t>=60?Math.floor(t/60)+':'+pad(t%60)+' min':t+' s'}
function holdTotal(ss){
  var t=ss.filter(function(x){return x.k==='time'}).reduce(function(a,x){return a+x.v},0);
  return (ss.length&&ss.every(function(x){return x.k==='time'})&&t>0)?' · Gesamt '+fmtDur(t):'';
}
function fmtSet(s){return s.k==='time'?(s.v+' s'):(s.v+'×'+(s.w>0?' +'+s.w+' kg':''))}

/* ---------- storage: private doc in the artifact db, localStorage as fallback ---------- */
function mirror(){try{localStorage.setItem(LS,JSON.stringify({cfg:cfg,days:days}))}catch(e){}}
var q=Promise.resolve(), cfgTimer=null;
function enqueue(fn){q=q.then(fn).then(function(){saveErr=false;noteStore()},function(){saveErr=true;noteStore()})}
function saveCfg(){
  mirror(); if(mode!=='cloud') return;
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(function(){enqueue(function(){return appRef.set(JSON.parse(JSON.stringify(cfg)))})},500);
}
function saveDay(k){
  mirror(); if(mode!=='cloud') return;
  var body=JSON.parse(JSON.stringify(days[k]||{sets:[]}));
  enqueue(function(){return appRef.collection('days').doc(k).set(body)});
}
function noteStore(){var n=$('#store-note');if(n)n.textContent=storeText()}
function storeText(){
  if(saveErr) return 'Speichern hat nicht geklappt. Die Daten liegen noch auf diesem Gerät.';
  return mode==='cloud'?'Gespeichert in deinem Claude-Konto. Nur du siehst diese Daten.':'Gespeichert nur auf diesem Gerät, weil dein Konto gerade nicht erreichbar war.';
}
async function initStore(){
  var ok=false;
  try{
    if(!window.claude||!window.claude.use) throw new Error('no claude');
    var u=await window.claude.use('user');
    var uid=u?await u.id():null;
    var d=await window.claude.use('db');
    if(d&&uid){
      var ref=d.doc('data/users/'+uid+'/app');
      var to=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},8000)});
      var s1=await Promise.race([ref.get(),to]);
      var s2=await Promise.race([ref.collection('days').get(),to]);
      if(s1.exists) adopt(s1.data());
      s2.docs.forEach(function(x){days[x.id]=x.data()});
      appRef=ref; mode='cloud'; ok=true;
    }
  }catch(e){}
  if(!ok){
    mode='local';
    try{var raw=localStorage.getItem(LS);if(raw){var o=JSON.parse(raw);adopt(o.cfg);days=o.days||{}}}catch(e){}
  }
}

/* ---------- sound ---------- */
function audio(){
  if(!ac){var C=window.AudioContext||window.webkitAudioContext;if(!C)return null;ac=new C()}
  if(ac.state==='suspended') ac.resume();
  return ac;
}
function volOf(cat){var v=cat==='p'?cfg.settings.volP:cfg.settings.volM;return (v>0?v:100)/100}
function tone(freq,dur,vol,type,delay,cat){
  if(!cfg.settings.sound) return;
  vol=Math.min(1,Math.max(0.0002,vol*volOf(cat)));

  var t0=a.currentTime+(delay||0);

  o.start(t0); o.stop(t0+dur+0.03);
}
function beep(f,d,v){tone(f,d||0.08,v||0.35,'sine')}
function buzz(p){try{if(cfg.settings.haptic!==false&&navigator.vibrate)navigator.vibrate(p)}catch(e){}}
function goalSound(){buzz([60,40,60,40,120]);tone(784,0.12,0.35,'triangle');tone(988,0.12,0.35,'triangle',0.14);tone(1319,0.3,0.4,'triangle',0.28)}

/* ---------- screen wake lock ---------- */
async function getWake(){
  try{if(navigator.wakeLock&&!wake){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',function(){wake=null})}}catch(e){}
}
function dropWake(){try{if(wake){wake.release();wake=null}}catch(e){}}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&T) getWake()});

/* ---------- timers: one at a time, shown in the dock ---------- */
function startTimer(t){T=t;clearInterval(tickId);tickId=setInterval(tick,100);getWake();renderDock();tick()}
function stopTimer(){T=null;clearInterval(tickId);tickId=null;dropWake();renderDock()}
function startHold(id){
  var e=getEx(id); if(!e) return;
  holdPend=null;
  audio();
  var prep=+cfg.settings.prep||0;
  startTimer({kind:'hold',id:id,target:e.target||0,beat:e.beat||2,startAt:Date.now()+prep*1000,started:prep===0,lastBeat:0,lastPrep:-1,horned:false});
  if(prep===0) beep(1320,0.25,0.5);
}
function startRest(id){
  var e=getEx(id); var secs=(e&&e.rest)||90;
  startTimer({kind:'rest',id:id,total:secs,endAt:Date.now()+secs*1000,horned:false});
}
function setDock(time,sub,pct,unit){
  var a=$('#d-time'),b=$('#d-sub'),c=$('#d-bar');
  if(a) a.innerHTML=time+(unit?'<small>'+unit+'</small>':'');
  if(b) b.textContent=sub;
  if(c) c.style.width=Math.max(0,Math.min(100,pct))+'%';
}
function mmss(s){s=Math.max(0,Math.ceil(s));return Math.floor(s/60)+':'+pad(s%60)}
function tick(){
  if(!T) return;
  var now=Date.now();
  if(T.kind==='hold'){
    if(now<T.startAt){
      var r=Math.ceil((T.startAt-now)/1000);
      if(r!==T.lastPrep){T.lastPrep=r;beep(660,0.1)}
      setDock(String(r),'Gleich geht es los',0,'');
      return;
    }
    if(!T.started){T.started=true;T.lastBeat=0;beep(1320,0.25,0.5);renderDock()}
    var el=(now-T.startAt)/1000;
    var k=Math.floor(el/T.beat);
    if(k>T.lastBeat){T.lastBeat=k;if(T.target&&el>=T.target)tone(1568,0.09,0.4,'triangle');else beep(880,0.07)}
    if(T.target&&el>=T.target&&!T.horned){T.horned=true;goalSound();renderDock()}
    var shown=el<60?String(Math.floor(el)):mmss(el-1+1);
    setDock(el<60?shown:Math.floor(el/60)+':'+pad(Math.floor(el%60)),(T.target&&el>=T.target?'+'+Math.floor(el-T.target)+' s über Ziel ('+T.target+' s)':'Schlag '+k+(T.target?' · Ziel '+T.target+' s':'')),T.target?el/T.target*100:0,el<60?'s':'');
  }else{
    var left=(T.endAt-now)/1000;
    if(left<=0&&!T.horned){T.horned=true;horn();renderDock()}
    setDock(mmss(left),'von '+mmss(T.total),T.total?(1-Math.max(0,left)/T.total)*100:0,'');
  }
}
function renderDock(){
  var d=$('#dock');
  if(!T&&holdPend){
    var pe=getEx(holdPend.id);
    d.hidden=false; d.className='dock hold';
    d.innerHTML='<div class="dock-in"><div class="d-top"><span>Hold · '+esc(pe?pe.name:'')+'</span><span>Gestoppt bei '+holdPend.secs+' s'+(pe&&pe.target?' · Vorgabe '+pe.target+' s':'')+'</span></div>'+
      '<div class="d-main"><div class="stepper conf"><button data-act="hadj" data-d="-1" aria-label="Eine Sekunde weniger">−</button><output>'+holdPend.v+'</output><button data-act="hadj" data-d="1" aria-label="Eine Sekunde mehr">+</button></div><div class="d-btns"><button class="btn go" data-act="holdsave">Speichern</button></div></div>'+
      '<div class="d-top qk"><button class="btn small" data-act="hadj" data-d="-5">−5</button><button class="btn small" data-act="hadj" data-d="5">+5</button>'+(holdPend.v!==holdPend.secs?'<button class="btn small" data-act="hset" data-v="'+holdPend.secs+'">'+holdPend.secs+' s übernehmen</button>':'')+'<button class="btn small" data-act="holdcancel">Verwerfen</button></div></div>';
    return;
  }
  if(!T){d.hidden=true;d.className='dock';d.innerHTML='';return}
  d.hidden=false;
  var e=getEx(T.id), name=e?e.name:'';
  if(T.kind==='hold'){
    var step=e?(e.ladder[e.level]||''):'';
    var prepping=!T.started;
    d.className='dock hold'+(T.horned?' done':'');
    d.innerHTML='<div class="dock-in"><div class="d-top"><span>Hold · '+esc(name)+'</span><span>'+esc(step)+'</span></div>'+
      '<div class="d-main"><div class="d-time" id="d-time">0</div><div class="d-btns">'+
      (prepping?'<button class="btn" data-act="cancel">Abbrechen</button>':'<button class="btn go" data-act="holdstop">Stopp &amp; speichern</button>')+
      '</div></div><div class="d-top"><span id="d-sub"></span></div><div class="dbar"><i id="d-bar"></i></div></div>';
  }else{
    d.className='dock rest'+(T.horned?' done':'');
    d.innerHTML='<div class="dock-in"><div class="d-top"><span>'+(T.horned?'Weiter geht’s':'Pause')+'</span><span id="d-sub"></span></div><div class="d-next">'+esc(nextName(T.id))+'</div>'+
      '<div class="d-main"><div class="d-time" id="d-time">0:00</div><div class="d-btns">'+
      '<button class="btn" data-act="restadd" data-d="-15" aria-label="15 Sekunden weniger">−15</button>'+
      '<button class="btn" data-act="restadd" data-d="15" aria-label="15 Sekunden mehr">+15</button>'+
      '<button class="btn go" data-act="cancel">Weiter</button></div></div><div class="dbar"><i id="d-bar"></i></div></div>';
  }
  tick();
}

    if(e.wt>0&&draft[e.id].w<e.wt){draft[e.id].w=e.wt;draft[e.id].reps=e.rmin||draft[e.id].reps}

function logSet(e,v,w,x){

  days[key].sets.push(Object.assign({e:e.id,n:e.name,s:e.ladder[e.level]||'',k:e.type,v:v,w:w||0,t:Date.now()},x||{}));

/* ---------- max test: one set to failure, then ladders and goals are calculated from it ---------- */
function testProposal(e,v,w){
  if(e.type==='ladder'){
    var pk=Math.max(3,Math.round(v*0.4)), bs=Math.max(1,pk-(LRUNGS-1)/2);
    return {kind:'ladder',peak:pk,base:bs,series:3,text:'Leiter '+rungs(pk,bs).join('-')+', 3 Serien ('+(3*sumR(pk,bs))+' Wiederholungen pro Einheit)',why:'Faustregel: Die Spitze liegt bei etwa 40 % deines Maximums, die Leiter hat höchstens '+LRUNGS+' Stufen. Später steigerst du über Serien und schiebst die ganze Leiter nach oben.'};
  }
  if(e.type==='time'){
    var t=Math.max(1,Math.round(v*0.7)), mn=Math.max(1,Math.round(v*0.55)), mx=Math.max(t,Math.round(v*0.85));
    return {kind:'time',target:t,tmin:mn,tmax:mx,text:'Ziel '+t+' s, Bereich '+mn+' bis '+mx+' s',why:'Faustregel: Das Ziel liegt bei etwa 70 % deines längsten Holds, die Untergrenze bei 55 % und die Obergrenze bei 85 %.'};
  }
  var rmax=Math.max(3,Math.round(v*0.8)), rmin=Math.max(2,Math.min(rmax,Math.round(v*0.6)));
  return {kind:'reps',rmin:rmin,rmax:rmax,text:'Bereich '+rmin+' bis '+rmax+' Wiederholungen'+(w>0?' bei '+w+' kg':''),why:'Faustregel: Der Arbeitsbereich liegt bei etwa 60 bis 80 % deines Maximums.'};
}
function recordTest(e,v,w){

function applyTest(e,p){
  var t=todayKey(), ses=sessionsOf(e.id);

  if(p.kind==='ladder'){e.peak=p.peak;e.base=p.base;e.series=p.series;e.up.push({d:t,s:'Test: Leiter '+rungs(p.peak,p.base).join('-')})}
  else if(p.kind==='time'){e.target=p.target;e.tmin=p.tmin;e.tmax=p.tmax;e.up.push({d:t,s:'Test: Ziel '+p.target+' s'})}
  else{e.rmin=p.rmin;e.rmax=p.rmax;e.up.push({d:t,s:'Test: '+p.rmin+'–'+p.rmax+' Wdh'})}

/* ---------- coaching engine: emphasis, goals, progression suggestions ---------- */
function todayKey(){return ymd(new Date())}
function dayKeys(){return Object.keys(days).filter(function(k){return (days[k].sets||[]).length}).sort()}
function setsOn(k,id){return ((days[k]&&days[k].sets)||[]).filter(function(s){return s.e===id})}
function sessionsOf(id){return dayKeys().filter(function(k){return setsOn(k,id).length})}
function sumR(p,b){return rungs(p,b).reduce(function(a,b){return a+b},0)}
function emphasis(){
  var skills=todayIds().map(getEx).filter(function(e){return e&&e.skill});
  if(skills.length<2) return null;
  var prior=dayKeys().filter(function(k){return k<todayKey()}).length;
  return skills[prior%skills.length].id;
}
function isHi(e){var em=emphasis();return em===null||em===e.id}
function goalText(e){
  if(e.type==='time'){
    var n=e.skill?(isHi(e)?e.setsHi:e.setsLo):(e.sets||3);
    return n+' Sätze × '+(e.target||0)+' s'+(e.tmax>e.target?' (Ziel bis '+e.tmax+' s)':'');
  }
  if(e.type==='ladder') return (e.series||3)+' Serien, Leiter '+rungs(e.peak||3,e.base).join('-')+(e.weight>0?' · +'+e.weight+' kg':'');
  if(e.rmax) return (e.sets||3)+' Sätze × '+e.rmin+'–'+e.rmax+(e.per?' pro Bein':'');
  return 'frei';

function subText(e){

function celebrate(e,v,w,x){
  if(x&&x.p!=null){ if(x.r===rungs(x.p,x.b).length-1) showToast('Serie geschafft','goal'); return }
  var prior=[];
  Object.keys(days).forEach(function(k){setsOn(k,e.id).forEach(function(st){if(st.s===(e.ladder[e.level]||''))prior.push(st)})});
  prior.pop();
  var sc=function(a,b){return (b||0)*1000+a};
  var best=prior.reduce(function(m,st){return Math.max(m,sc(st.v,st.w))},-1);
  if(prior.length&&sc(v,w)>best){showToast(e.type==='time'?'Neue Bestzeit: '+v+' s':'Neuer Bestwert: '+v+(w>0?' × '+w+' kg':''),'best');return}
  var hit=e.type==='time'?(e.target&&v>=e.target):(e.type==='reps'&&e.rmax&&v>=e.rmax);
  if(hit) showToast('Ziel geschafft','goal');

function animateCounts(){

  var els=document.querySelectorAll('[data-count]'); if(!els.length) return;
  var t0=null;
  var items=[].map.call(els,function(el){var raw=el.getAttribute('data-count'),dec=/[.,]/.test(raw);return {el:el,raw:raw,v:parseFloat(raw.replace(',','.')),dec:dec}});
  function step(ts){
    if(t0===null)t0=ts; var k=Math.min(1,(ts-t0)/700), ez=1-Math.pow(1-k,3);
    items.forEach(function(it){var cur=it.v*ez; it.el.textContent=it.dec?(Math.round(cur*10)/10).toFixed(1).replace('.',','):String(Math.round(cur))});
    if(k<1) requestAnimationFrame(step); else items.forEach(function(it){it.el.textContent=it.raw});
  }
  items.forEach(function(it){it.el.textContent=it.dec?'0,0':'0'});

}

  if(l>=5) h+='<path class="ft" d="'+T+'" fill="url(#'+id+'m)" opacity=".7" transform="translate(-18 30) scale(.65)"/><path class="ft" d="'+T+'" fill="url(#'+id+'m)" opacity=".7" transform="translate(118 30) scale(-.65 .65)"/>';
  var tr='transform="translate(50 112) scale('+sc+') translate(-50 -112)"';
  h+='<g '+tr+'><path class="fo" d="'+O+'" fill="url(#'+id+'o)"/><path class="fm" d="'+M+'" fill="url(#'+id+'m)"/><path class="fc" d="'+C+'" fill="#fff"/></g>';
  var n=l>=5?6:l>=4?3:0, i;
  for(i=0;i<n;i++) h+='<circle class="sp" cx="'+(28+i*13)+'" cy="'+(52+(i%2)*10)+'" r="'+(i%2?1.8:2.6)+'" fill="#9BF5E3" style="animation-delay:'+(i*.35)+'s"/>';
  return h+'</svg>';
}

  var m=dayMinutes(k), prs=(prMap()[k]||[]).length, goal=cfg.settings.goal||3, w=streakWeeks(goal);
  var cnt=dayKeys().filter(function(x){return ymd(monday(parseYmd(x)))===ymd(monday(new Date()))}).length;
  var reached=cnt===goal;
  var cf='', cols=['#9BF5E3','#fff','#2FD9BF','#D4FFF6','#FFD27A'];

   '<h1>Training geschafft!</h1>'+
   '<div class="cst"><div><b>'+nSets+'</b><small>Sätze</small></div><div><b>'+(m||'–')+'</b><small>Minuten</small></div>'+(prs?'<div><b>★ '+prs+'</b><small>Bestleistung'+(prs>1?'en':'')+'</small></div>':'')+'</div>'+
   (w>0?'<div class="fl">'+flameSvg(w,w>=8?190:150)+'<b>'+w+(w===1?' Woche':' Wochen')+' in Serie</b><span>'+(reached?'Wochenziel erreicht – die Flamme wächst':(cnt+' von '+goal+' Trainings diese Woche'))+'</span></div>':
     '<div class="fl"><span>'+cnt+' von '+goal+' Trainings diese Woche</span></div>')+

/* ---- Reihenfolge per langem Druck und Ziehen ---- */
var dragBlock=0, DR=null;
(function(){
  var timer=null, sx=0, sy=0, pid=null;
  function cancel(){clearTimeout(timer);timer=null;pid=null}
  function loop(){
    if(!DR) return;
    var H=window.innerHeight, y=DR.y;
    if(y<100) window.scrollBy(0,-Math.min(18,(100-y)/4)); else if(y>H-100) window.scrollBy(0,Math.min(18,(y-(H-100))/4));
    var c=DR.card, r=c.getBoundingClientRect(), nat=r.top-DR.t, want=DR.y-DR.grab, cy=want+r.height/2, pv=c.previousElementSibling, nx=c.nextElementSibling, q;
    while(pv&&pv.classList.contains('exa')){q=pv.getBoundingClientRect();if(cy<q.top+q.height/2){c.parentNode.insertBefore(c,pv);DR.moved=true;pv=c.previousElementSibling}else break}
    while(nx&&nx.classList.contains('exa')){q=nx.getBoundingClientRect();if(cy>q.top+q.height/2){c.parentNode.insertBefore(c,nx.nextSibling);DR.moved=true;nx=c.nextElementSibling}else break}
    r=c.getBoundingClientRect(); nat=r.top-DR.t;
    DR.t=want-nat; c.style.transform='translateY('+DR.t.toFixed(1)+'px)';
    DR.raf=requestAnimationFrame(loop);
  }
  function start(id,y){
    if(openId){openId=null;render()}
    var c=document.querySelector('.exa[data-exid="'+id+'"]'); if(!c) return;
    var r=c.getBoundingClientRect();
    DR={id:id,card:c,grab:Math.max(12,Math.min(r.height-12,y-r.top)),y:y,t:0,moved:false,raf:0};
    c.classList.add('dragging'); document.body.classList.add('dragmode'); buzz(18);
    loop();
  }
  function end(){
    if(!DR) return;
    var D=DR; DR=null; cancelAnimationFrame(D.raf);
    dragBlock=Date.now()+400;
    document.body.classList.remove('dragmode'); D.card.classList.remove('dragging'); D.card.style.transform='';
    if(D.moved){
      var ids=[].map.call(document.querySelectorAll('.exa'),function(el){return el.dataset.exid}), k=todayKey();
      if(!days[k]) days[k]={sets:[]};
      days[k].order=ids; saveDay(k); buzz(10); showToast('Reihenfolge geändert');
    }
    render();
  }
  document.addEventListener('pointerdown',function(ev){
    if(loading||DR||(ev.pointerType==='mouse'&&ev.button>0)) return;
    var h=ev.target.closest&&ev.target.closest('.ex-head'); if(!h||!h.closest('.exa')) return;
    var id=h.closest('.exa').dataset.exid; sx=ev.clientX; sy=ev.clientY; pid=ev.pointerId;
    clearTimeout(timer); timer=setTimeout(function(){timer=null;start(id,sy)},430);
  });
  document.addEventListener('pointermove',function(ev){
    if(DR){DR.y=ev.clientY;return}
    if(timer&&Math.abs(ev.clientY-sy)+Math.abs(ev.clientX-sx)>10) cancel();
  });
  document.addEventListener('pointerup',function(){if(DR) end(); else cancel()});
  document.addEventListener('pointercancel',function(){if(DR) end(); else cancel()});
  document.addEventListener('touchmove',function(ev){if(DR&&ev.cancelable) ev.preventDefault()},{passive:false});
  document.addEventListener('contextmenu',function(ev){if(DR||timer) ev.preventDefault()});
})();
window.addEventListener('appinstalled',function(){deferredInstall=null;if(!loading)render()});
function isStandalone(){return (window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches)||window.navigator.standalone===true}
/* tap a stepper number to type it: the typed value is turned into one step of the plus button */
document.addEventListener('click',function(ev){
  if(loading) return;
  var o=ev.target.closest&&ev.target.closest('.stepper output');
  if(!o||o.classList.contains('wide')||o.querySelector('input')) return;
  var btns=o.parentNode.querySelectorAll('button[data-act]');
  if(btns.length<2) return;
  var plus=btns[btns.length-1];
  if(isNaN(parseFloat(plus.dataset.d))) return;
  var cur=parseFloat(String(o.textContent).replace(',','.')); if(isNaN(cur)) cur=0;
  var inp=document.createElement('input');
  inp.type='text'; inp.inputMode='decimal'; inp.className='numin'; inp.value=String(cur).replace('.',','); inp.setAttribute('aria-label','Wert eintippen');
  o.textContent=''; o.appendChild(inp); inp.focus(); inp.select();
  var fin=false;
  function done(ok){
    if(fin) return; fin=true;
    var val=parseFloat(inp.value.replace(',','.'));
    if(ok&&!isNaN(val)&&val>=0&&val!==cur){
      var cl=plus.cloneNode(true); cl.dataset.d=String(Math.round((val-cur)*100)/100);
      cl.style.display='none'; $('#view').appendChild(cl); cl.click(); if(cl.parentNode) cl.parentNode.removeChild(cl);
    }else{render();renderDock()}
  }
  inp.addEventListener('blur',function(){done(true)});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();inp.blur()}else if(e.key==='Escape'){done(false)}});
});

document.addEventListener('input',function(ev){var t=ev.target;
  if(t&&t.classList&&t.classList.contains('volr')){var c=t.getAttribute('data-c'),n=parseInt(t.value,10);cfg.settings[c==='p'?'volP':'volM']=n;var lb=document.getElementById('vl-'+c);if(lb)lb.textContent=n+' %';saveCfg();return}
  if(t&&t.classList&&t.classList.contains('pk-in'))pickerFill(t.parentNode)});
document.addEventListener('change',function(ev){
  if(ev.target&&ev.target.classList&&ev.target.classList.contains('volr')){audio();if(ev.target.getAttribute('data-c')==='p')horn();else beep(880,0.12);return}
  
  var nt=ev.target;
  if(nt&&nt.id==='day-note'){var nk=ymd(new Date());if(!days[nk])days[nk]={sets:[]};days[nk].note=nt.value;if(!nt.value)delete days[nk].note;saveDay(nk);return}
  var t=ev.target; if(!t||t.id!=='imp-file'||!t.files||!t.files[0]) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var o=JSON.parse(String(rd.result));
      if(!o||o.app!=='calisthenics-log'||!o.cfg||typeof o.days!=='object') throw new Error('format');
      impPending={cfg:o.cfg,days:o.days,at:o.exported||''}; impMsg='';
    }catch(e){impPending=null;impMsg='Diese Datei ist keine Sicherung dieser App.'}
    render();
  };
  rd.onerror=function(){impMsg='Die Datei konnte nicht gelesen werden.';render()};
  rd.readAsText(t.files[0]);
});
